# Follow-up evaluation (run 2): shot-aware quantum kernels, tuned, fit and evaluated with finite shots.
#   python scripts/final_eval.py --config configs/test_eval_shot_aware.yaml   # about 30 minutes
# The main evaluation (test_eval.yaml) showed the fidelity-kernel model collapsing under shot noise when tuned
# on exact kernels; here every kernel entry is estimated from S shots inside cross-validation as well.
# Values (not comments) are hashed into the run log's config_hash.
note: "run 2 (post-hoc, after run 1): shot-aware quantum kernels (fidelity and projected), tuned, fit and evaluated with 100 / 1,000 / 10,000 shots per circuit; quantum section only; everything else as run 1"
sections: [quantum]            # the main evaluation runs all four (quantum, track_a, shots, noise)

seeds: [0, 1, 2]

# Quantum models and their classical comparisons, at the quantum-comparable sizes (Track B
# protocol: Yeo-Johnson scaling, sqrt target, 5-fold CV inside each training set).
quantum:
  sizes: [100, 300, 1000]
  inputs:                       # name: [feature set, reduction or null]
    pls10: [all_legal, [pls, 10]]
    all_legal: [all_legal, null]
    composition: [composition, null]
  # Model names: name@S = shot-aware (tuned, fit and evaluated with S shots per circuit). The exact models
  # and the RBF twins are rerun as a reproduction check against the main evaluation.
  models:                       # model: inputs it runs on
    mean: [none]
    rbf_krr: [pls10, all_legal]         # the matched classical twin and the best Track B
    qkrr: [pls10]                       # exact simulation
    qkrr@100: [pls10]
    qkrr@1000: [pls10]
    qkrr@10000: [pls10]
    pqk: [pls10]                        # exact simulation
    pqk@100: [pls10]
    pqk@1000: [pls10]

# The most accurate classical models (Track A protocol: log scaling, standardized target).
track_a:
  sizes: [100, 300, 1000, 3000, 10000]
  full_pool_seeds: [0]          # the full 99,198-molecule pool, for these seeds only (cost; 30,000 skipped)
  models: [mean, ridge, rbf_krr, xgb, charge_net]
  rbf_krr_max_n: 10000

# Finite-shot inference on the quantum test subsets (exact binomial sampling, as validated
# against Aer in notebook 09), at each model's settings chosen in the `quantum` section.
shots:
  models: [qkrr, pqk, qridge]
  sizes: [100, 300, 1000]
  shots: [100, 1000, 10000]
  reps: 5

# Noisy simulation (fake-backend noise model on local Aer; never IBM hardware).
noise:
  backend: FakeFez
  n_train: 100
  seed: 0
  per_subset: 30                # molecules from each quantum test subset
  shots: 1000
